name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@44a74c53d4b35b7242908ee51082fb503460a8d0 # main
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
