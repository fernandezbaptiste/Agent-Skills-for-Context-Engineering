name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@7d8ef58f9bf79f566b5a41401df721930dea0f12 # main
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
