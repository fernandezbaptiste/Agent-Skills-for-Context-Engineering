name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@628e50995fec3c7a5995a621dcbd8a03c5a68075 # main
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
