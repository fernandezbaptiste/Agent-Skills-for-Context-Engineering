name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@10ed07a5edeba97268ef1adf6264d5b0df6ee72c # main
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
