name: Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@420c25de8223fe419a4ad10aad2c930d161c3c47 # main
        with:
          optimize: true
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
